[workspace]

members = [
  "program",
  "clients/rust",
  "integration_tests",
]

resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solana-foundation/solana-attestation-service"

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "warn"
unused_variables = "warn"
deprecated = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace.dependencies]
borsh = "1.5.5"
codama = "0.9.3"
const-crypto = "0.3.0"
num-derive = "0.4"
num-traits = "0.2"
pinocchio = { version = "0.11.2", features = ["account-resize", "cpi"] }
pinocchio-log = "0.5.1"
pinocchio-system = "0.6.1"
pinocchio-token-2022 = "0.4.0"
pinocchio-associated-token-account = "0.4.0"
serde = "1.0"
serde_json = "1.0"
serde_with = "3.0"
solana-attestation-service-client = { path = "clients/rust" }
solana-account = "~3.4"
solana-account-info = "~3.1"
solana-cpi = "~3.1"
solana-instruction = "3.1"
solana-address = { version = "2.8.0", features = ["curve25519", "decode"] }
solana-program-error = "~3.0"
solana-rpc-client = "3.1.8"
thiserror = "2.0"
bs58 = "0.4"
