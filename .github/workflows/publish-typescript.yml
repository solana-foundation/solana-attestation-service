name: Publish TypeScript Client

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (unchecked will publish to npm, push git tag, and create GitHub release)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ts-client-publish
  cancel-in-progress: false

jobs:
  guard-allowed-branch:
    name: Guard allowed source branch for release publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard allowed source branch for release publish
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/master|refs/heads/release/*) ;;
            *)
              echo "::error::Publish TypeScript Client must be run from master or a release/* branch. Current ref: $REF"
              exit 1
              ;;
          esac

  test:
    name: Run release tests
    needs: guard-allowed-branch
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish sas-lib package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [guard-allowed-branch, test]
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: ./.github/actions/setup
        with:
          install-solana: 'false'
          rust-cache-key: 'rust-dev'

      - name: Check the committed IDL and build TypeScript client
        run: just check-generated build-client

      - name: Publish TypeScript client
        id: npm_publish
        uses: solana-foundation/github-actions/npm-publish@e6ed2eb93c55eca911dbc711fb08683b42926a28 # v0.2.15
        with:
          package: sas-lib
          package-directory: clients/typescript
          check-version-available: ${{ !inputs.dry-run }}
          dry-run: ${{ inputs.dry-run }}
          skip-existing: 'true'

      - name: Create and push tag
        if: ${{ !inputs.dry-run && steps.npm_publish.outputs.published == 'true' }}
        env:
          TAG: ts-client-v${{ steps.npm_publish.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$TAG already exists on a commit other than the one just published"
              exit 1
            fi
          else
            git tag "$TAG"
            echo "Created tag $TAG"
          fi
          git push origin "refs/tags/$TAG"

      - name: Require tag for already published version
        if: ${{ !inputs.dry-run && steps.npm_publish.outputs.already-published == 'true' }}
        env:
          TAG: ts-client-v${{ steps.npm_publish.outputs.version }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Version is already published but $TAG does not exist. Push $TAG from the published commit, then rerun."
            exit 1
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run && (steps.npm_publish.outputs.published == 'true' || steps.npm_publish.outputs.already-published == 'true') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.npm_publish.outputs.version }}
          NPM_TAG: ${{ steps.npm_publish.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;
            const tagName = `ts-client-v${version}`;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              console.log(`Release ${tagName} already exists, skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const body = [
              `## sas-lib v${version}`,
              '',
              '### Installation',
              '',
              '```bash',
              'pnpm add sas-lib',
              '```',
              '',
              `https://www.npmjs.com/package/sas-lib/v/${version}`,
            ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              target_commitish: context.sha,
              name: `TypeScript Client v${version}`,
              body,
              draft: false,
              prerelease: process.env.NPM_TAG === 'beta',
            });

      - name: Publish summary
        env:
          VERSION: ${{ steps.npm_publish.outputs.version }}
          NPM_TAG: ${{ steps.npm_publish.outputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          PUBLISHED: ${{ steps.npm_publish.outputs.published }}
          ALREADY_PUBLISHED: ${{ steps.npm_publish.outputs.already-published }}
        run: |
          echo "## sas-lib" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**npm tag**: \`${NPM_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DRY_RUN" == "true" ]; then
            echo "Dry run: OIDC auth validated, no package uploaded, no tag, no release" >> $GITHUB_STEP_SUMMARY
          elif [ "$PUBLISHED" == "true" ]; then
            echo "Published to npm: https://www.npmjs.com/package/sas-lib/v/${VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "**Tag**: \`ts-client-v${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          elif [ "$ALREADY_PUBLISHED" == "true" ]; then
            echo "Skipped npm publish; version already exists" >> $GITHUB_STEP_SUMMARY
            echo "**Tag**: \`ts-client-v${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi
