name: Test

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: '4.3.0'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          install-solana: 'false'
          rust-cache-key: 'unit-test'
          save-rust-cache: 'true'

      - name: Run unit tests
        run: just unit-test

  rust-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: 'rust-integration-test'
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Run Rust integration tests
        run: just integration-test

  typescript-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          install-solana: 'false'
          rust-cache-key: 'typescript-test'

      - name: Run TypeScript client tests
        run: just test-client
